# Gera os áudios do BíbliaLearn com o ElevenLabs e faz commit na branch escolhida.
# Requer o segredo ELEVENLABS_API_KEY (Settings → Secrets and variables → Actions).
name: Gerar áudios (ElevenLabs)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Limite de clipes (0 = todos)"
        default: "0"
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Gerar clipes
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          cd biblelingo
          node tools/gen-audio.mjs --limit=${{ github.event.inputs.limit }}
      - name: Commit dos áudios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biblelingo/audio
          git diff --cached --quiet && echo "Nada a commitar" || git commit -m "chore: áudios gerados com ElevenLabs"
          git push
